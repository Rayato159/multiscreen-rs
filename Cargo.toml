[package]
name = "multiscreen-rs"
authors = ["Ruangyot Nanchiang <rayato159@gmail.com>"]
version = "0.2.5"
edition = "2024"
license = "MIT"
description = "A Rust implementation of the Multiscreen neural language model — training and inference powered by Burn."
readme = "README.md"
repository = "https://github.com/Rayato159/multiscreen-rs"
documentation = "https://docs.rs/multiscreen-rs"
keywords = ["multiscreen", "neural-network", "language-model", "burn"]
categories = ["science", "text-processing"]
include = [
    "src/**",
    "examples/chat_with_tokenizer.rs",
    "examples/train_with_tokenizer.rs",
    "examples/plot_loss.py",
    "examples/data/.gitkeep",
    "tests/**",
    "Cargo.toml",
    "README.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "autodiff", "flex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sentencepiece-rs = "0.1.0"
rand = "0.8"

[features]
default = []
cuda = ["burn/cuda"]
